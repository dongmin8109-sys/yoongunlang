<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8bdcf3">
  <meta name="description" content="윤봇과 함께 놀며 윤건언어를 배우는 어린이 놀이터">
  <title>윤건언어 키즈존 · 윤봇의 놀이터</title>
  <link rel="stylesheet" href="/kidszone.css">
  <script src="/kidszone.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">놀이 화면 바로가기</a>
  <header class="topbar">
    <a class="home-link" href="/" aria-label="윤건언어 메인으로">← 윤건언어</a>
    <strong class="brand">윤봇의 <span>키즈존</span></strong>
    <div class="top-actions"><span class="star-total" aria-label="모은 별"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m16 2 4.1 8.6 9.5 1.3-6.9 6.7 1.7 9.5L16 23.6l-8.4 4.5 1.7-9.5-6.9-6.7 9.5-1.3z"/></svg><b id="starTotal">0</b></span><button id="soundToggle" type="button" aria-pressed="false">소리 켜기</button><button id="motionToggle" type="button" aria-pressed="false">움직임 줄이기</button></div>
  </header>

  <main id="main">
    <section id="playground" class="playground" aria-labelledby="welcomeTitle">
      <div class="intro-row"><div><p class="eyebrow">HELLO, LITTLE EXPLORER!</p><h1 id="welcomeTitle">놀면서 배우는<br><span>윤건언어 놀이터</span></h1><p class="intro-help">옆으로 밀거나 화살표를 눌러 다른 곳을 구경해요.</p></div><div class="settings"><label>나의 모험 <select id="levelSelect"><option value="sprout">새싹 · 5~7세</option><option value="explorer">탐험 · 8~10세</option><option value="master">마스터 · 11~13세</option></select></label><label>놀이터 테마 <select id="themeSelect"><option value="rainbow">무지개 놀이터</option><option value="robot">로봇·자동차·공룡</option><option value="magic">동물·요정·마법</option><option value="space">우주·모험</option></select></label></div></div>
      <div class="scene-wrap"><button class="pan pan-left" id="panLeft" type="button" aria-label="놀이터 왼쪽 보기">‹</button><div id="sceneViewport" class="scene-viewport" tabindex="0" aria-label="시설 9개가 있는 놀이터. 좌우 화살표로 이동"><div class="scene-world" id="sceneWorld"><div class="sky-decor cloud c1"></div><div class="sky-decor cloud c2"></div><div class="sky-decor cloud c3"></div><div class="sky-decor butterfly b1">✦</div><div class="sky-decor butterfly b2">✦</div><div class="sky-decor balloon"></div><div class="hills"></div><div class="path"></div><div id="facilityLayer"></div></div></div><button class="pan pan-right" id="panRight" type="button" aria-label="놀이터 오른쪽 보기">›</button></div>
      <p class="scene-caption">시설을 눌러 입장해요! <span>✦</span> 9개의 모험이 기다리고 있어요.</p>
      <div class="bot-guide" id="botGuide"><div class="bot" id="bot" aria-hidden="true"><i class="antenna"></i><i class="head"><i class="eyes"></i><i class="smile"></i></i><i class="body"></i><i class="arm left"></i><i class="arm right"></i><i class="leg left"></i><i class="leg right"></i></div><div class="speech"><strong>윤봇</strong><p id="botMessage" aria-live="polite"></p><button id="speakButton" type="button">안내 다시 듣기</button></div></div>
    </section>
    <section id="activity" class="activity" hidden aria-live="polite"><div class="activity-head"><button id="backButton" class="back-button" type="button">← 놀이터로</button><div><p class="eyebrow" id="activityEyebrow">KIDS ZONE</p><h2 id="activityTitle"></h2></div><span id="activityBadge" class="activity-badge"></span></div><div class="activity-guide"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6V2" stroke="#347fc4" stroke-width="4"/><circle cx="32" cy="6" r="4" fill="#ff9cb4"/><rect x="7" y="11" width="50" height="45" rx="18" fill="#78c9f3" stroke="#347fc4" stroke-width="4"/><circle cx="24" cy="30" r="4" fill="#274d73"/><circle cx="41" cy="30" r="4" fill="#274d73"/><path d="M23 40q9 10 19 0" fill="none" stroke="#274d73" stroke-width="3"/></svg><p><strong>윤봇:</strong> <span id="activityBotMessage" aria-live="polite"></span></p></div><div id="activityContent"></div></section>
  </main>
  <footer class="kids-footer">윤건언어 키즈존 · 별과 꾸미기 정보는 이 기기에만 저장돼요. <a href="/portal.html">윤건언어 포털</a></footer>
</body>
</html>
